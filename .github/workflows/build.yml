name: Build

on:
  push:
  pull_request:

jobs:
  build-gnat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install GNAT
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat gprbuild

      - name: Build
        run: |
          gprbuild -P adavtt.gpr
